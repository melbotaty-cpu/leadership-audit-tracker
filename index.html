<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leadership Audit Tracker</title><link rel="stylesheet" href="styles.css"></head><body><section id="loginView" class="center"><div class="card login"><div class="logo">LAT</div><h1>Leadership Audit Tracker</h1><p class="muted">Sign in to manage your department audit.</p><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Sign in</button><p id="loginError" class="error"></p></form></div></section><section id="dashboardView" class="hidden"><header><div><div class="logo small">LAT</div><div><h1>Leadership Audit Tracker</h1><p id="userLabel" class="muted"></p></div></div><button id="logoutBtn" class="secondary">Sign out</button></header><main><div id="message" class="message hidden"></div><div class="stats"><div class="card stat"><span>Total actions</span><b id="totalActions">0</b></div><div class="card stat"><span>Completed</span><b id="completedActions">0</b></div><div class="card stat"><span>Progress</span><b id="progress">0%</b></div></div><section class="card"><div class="sectionHead"><div><h2>Audit checklist</h2><p class="muted">Record evidence when an action is completed.</p></div><button id="refreshBtn" class="secondary">Refresh</button></div><div id="actionsList"></div></section><section id="adminSection" class="card hidden"><div class="sectionHead"><h2>Admin overview</h2></div><div id="adminTable"></div></section></main></section><div id="entryModal" class="modal hidden"><div class="card modalBox"><button id="closeModal" class="close">×</button><h2 id="modalTitle">Record evidence</h2><form id="entryForm"><input id="modalActionId" type="hidden"><label>Date completed<input id="doneOn" type="date" required></label><label>Evidence / note<textarea id="note" maxlength="500" rows="5"></textarea></label><button>Save evidence</button><p id="entryError" class="error"></p></form></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
