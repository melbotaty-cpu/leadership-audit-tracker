 <label>${t('Action')}</label><select onchange="ls.a=+this.value;drawLog()">${dm.map(d=>`<optgroup label="${dn(d)}">${opts.filter(x=>x[1]==d).map(x=>`<option value="${x[0]}" ${x[0]==ls.a?'selected':''}>${esc(nm(x))}</option>`).join('')}</optgroup>`).join('')}</select>
 <div class="st" style="margin-top:4px">${fq(p.role=='hoi'?a[4]:a[3])}${a[5]?' · '+t('Evidence')+': '+esc(a[5]):''}</div>
 <label>${t('Date completed')}</label><input type="date" id="ld" value="${TI}" max="${TI}"><label>${t('Note (optional)')}</label><textarea id="ln" rows="2" maxlength="500"></textarea>
 <div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="closeLog()">${t('Cancel')}</button><button class="p" id="sv" onclick="saveLog()">${t('Save entry')}</button></div>`}
function closeLog(){$('ov').classList.remove('on')}
async function saveLog(){$('sv').disabled=true;const{error}=await SB.from('entries').insert({leader_id:lp,action_id:ls.a,done_on:$('ld').value||TI,note:$('ln').value.trim()||null});if(error){toast('Not saved: '+error.message);$('sv').disabled=false;return}closeLog();toast(t('Entry saved'));await refresh();render()}
function openPw(){$('md').innerHTML=`<h3 style="margin:0">${t('Change passcode')}</h3><label>${t('New passcode (8+ characters)')}</label><input type="password" id="p1" autocomplete="new-password"><label>${t('Confirm passcode')}</label><input type="password" id="p2" autocomplete="new-password"><div class="row" style="margin-top:14px;justify-content:flex-end"><button onclick="closeLog()">${t('Cancel')}</button><button class="p" onclick="savePw()">${t('Save')}</button></div>`;$('ov').classList.add('on')}
async function savePw(){const a=$('p1').value;if(a.length<8||a!=$('p2').value)return toast('Passcodes must match and be 8+ characters');const{error}=await SB.auth.updateUser({password:a});if(error)return toast(error.message);closeLog();toast(t('Passcode updated'))}
$('ov').onclick=e=>{if(e.target.id=='ov')closeLog()};$('per').onchange=e=>{per=PER.find(p=>p.k==e.target.value);render()};
SB.auth.onAuthStateChange(ev=>{if(ev=='SIGNED_OUT'&&mel)loginView()});
setInterval(()=>{const a=document.activeElement;if(mel&&!$('ov').classList.contains('on')&&!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))refresh().then(render)},120000);
boot();
function cell(p,a){const q=p.role=='hoi'?a[4]:a[3];if(!q)return null;
 const tdays=Math.round((D(per.e)-D(per.s))/DAY)+1,days=Math.max(0,Math.min(tdays,Math.round((T-D(per.s))/DAY)+1)),left=tdays-days;
 let exp=0,tot=0;
 if(q=='W'){exp=Math.floor(days/7);tot=Math.floor(tdays/7)}else if(q=='B'){exp=Math.floor(days/14);tot=Math.floor(tdays/14)}else if(q=='M'){exp=Math.floor(days/30.4);tot=Math.floor(tdays/30.4)}else if(q=='S'||(q=='A'&&per.k=='S2')){tot=1;exp=left<=30?1:0}
 const s=q=='A'?PER[0].s:per.s,e=q=='A'?PER[1].e:per.e,its=(logs[p.id]||[]).filter(l=>l.a==a[0]&&l.d>=s&&l.d<=e),done=its.length,last=its.map(l=>l.d).sort().pop()||null,gap=exp-done;
 let st=!tot&&!exp?'na':(tot&&done>=tot)?'done':gap<=0?'ok':(gap>=2||done==0)?'bad':'warn';
 return{q,exp,tot,done,last,left,st,gap}}
const ago=d=>Math.round((T-D(d))/DAY);
function stats(p){let e=0,d=0,bad=0,wn=0,tt=0,td=0;ACT.forEach(a=>{const c=cell(p,a);if(!c)return;e+=c.exp;d+=Math.min(c.done,c.exp);tt+=c.tot;td+=Math.min(c.done,c.tot);if(c.st=='bad')bad++;if(c.st=='warn')wn++});
 return{score:e?Math.round(d/e*100):null,bad,wn,comp:tt?Math.round(td/tt*100):null,e,d}}
const col=s=>s==null?'':s>=85?'ok':s>=60?'wn':'bad';
function alerts(){const out=[];VP().forEach(p=>{ACT.forEach(a=>{const c=cell(p,a);if(!c)return;const L=ar();
 if(c.st=='bad'||c.st=='warn')out.push({sev:c.st=='bad'?2:1,g:c.gap,p,t:L?`<b>${pn(p)}</b> · ${nm(a)} — ${c.done} من ${c.exp} مطلوبة (${fq(c.q)})${c.last?`، آخر تسجيل قبل ${ago(c.last)} يومًا`:'، لا يوجد تسجيل بعد'}`:`<b>${esc(p.name)}</b> · ${esc(a[2])} — ${c.done} of ${c.exp} expected (${FQ[c.q]})${c.last?`, last logged ${ago(c.last)}d ago`:', nothing logged yet'}`});
 else if(c.tot==1&&!c.done&&c.left<=45&&c.left>30)out.push({sev:1,g:0,p,t:L?`<b>${pn(p)}</b> · ${nm(a)} — مستحق قبل نهاية الفصل (${c.left} يومًا)`:`<b>${esc(p.name)}</b> · ${esc(a[2])} — due by end of semester (${c.left} days left)`})});
 const al=(logs[p.id]||[]).map(l=>l.d).sort().pop();if((T-D(per.s))/DAY>14&&(!al||ago(al)>14))out.unshift({sev:3,g:9,p,t:ar()?`<b>${pn(p)}</b> — لا يوجد نشاط مسجّل منذ ١٤ يومًا`:`<b>${esc(p.name)}</b> — no activity logged in the last 14 days`})});
 return out.sort((a,b)=>b.sev-a.sev||b.g-a.g)}
function ov(){const ps=VP().map(p=>({p,s:stats(p)})),al=alerts(),sh=al.filter(a=>!fp||a.p.id==fp),lim=showAll?500:10,L=ar();
 const ex=ps.reduce((a,x)=>a+x.s.e,0),dd=ps.reduce((a,x)=>a+x.s.d,0),o=ex?Math.round(dd/ex*100):null,wk=Object.values(logs).flat().filter(l=>(T-D(l.d))/DAY<7&&l.d<=TI).length;
 return `<div class="g k"><div class="card"><div class="mut">${t('On-track score (to date)')}</div><div class="kv ${col(o)}">${o==null?'—':o+'%'}</div><div class="mut">${t(per.n)}</div></div>
 <div class="card"><div class="mut">${t('Critical alerts')}</div><div class="kv ${al.filter(a=>a.sev>1).length?'bad':'ok'}">${al.filter(a=>a.sev>1).length}</div><div class="mut">${al.length} ${t('total')}</div></div>
 <div class="card"><div class="mut">${t('Logged last 7 days')}</div><div class="kv">${wk}</div></div>
 ${adm?`<div class="card"><div class="mut">Leaders at ≥85%</div><div class="kv">${ps.filter(x=>x.s.score>=85).length}<span class="mut"> / ${ps.length}</span></div></div>`:''}</div>
 ${adm?`<h3 style="margin:16px 0 8px">Leaders <span class="mut">(tap to filter alerts)</span></h3><div class="g c2">${ps.map(({p,s})=>`<div class="card pc ${fp==p.id?'on':''}" onclick="fp=fp=='${p.id}'?null:'${p.id}';render()"><div class="r"><b>${esc(p.name)}</b><span class="kv ${col(s.score)}" style="font-size:20px">${s.score==null?'—':s.score+'%'}</span></div>
 <div class="bar"><i class="bg-${col(s.score)||'ok'}" style="width:${s.score||0}%"></i></div><div class="mut" style="margin-top:6px">${p.role=='hoi'?'Head of Inclusion':'Head of Dept'} · <span class="bad">${s.bad} overdue</span> · <span class="wn">${s.wn} behind</span> · period ${s.comp==null?'—':s.comp+'%'} complete${p.lang=='ar'?' · AR':''}</div></div>`).join('')}</div>`:''}
 <h3 style="margin:16px 0 8px">${t('Alerts')} ${fp&&adm?'· '+esc(P().find(p=>p.id==fp)?.name||''):''}</h3><div class="card">${sh.length?sh.slice(0,lim).map(a=>`<div class="al"><span class="dot bg-${a.sev>1?'bad':'wn'}"></span><div style="flex:1">${a.t}</div><button onclick="openLog('${a.p.id}')">${t('Log')}</button></div>`).join('')+(sh.length>lim?`<div style="padding-top:8px"><button onclick="showAll=true;render()">${L?'عرض الكل':'Show all'} ${sh.length}</button></div>`:''):`<div class="empty">${t('No alerts — everyone is on track.')}</div>`}</div>`}
function mx(){const ps=VP();let h=`<div class="mut" style="margin-bottom:8px">${t('Each cell: logged / expected to date. Tap a cell to log an action.')}</div><div class="tw"><table><tr><th>${t('Action')}</th>${ps.map(p=>`<th>${pn(p)}</th>`).join('')}</tr>`,dm='';
 ACT.forEach(a=>{if(!ps.some(p=>cell(p,a)))return;if(a[1]!=dm){dm=a[1];h+=`<tr class="dm"><td colspan="${ps.length+1}">${dn(dm)}</td></tr>`}
 h+=`<tr><td>${esc(nm(a))}<div class="mut">${fq(a[3]||a[4])}</div></td>${ps.map(p=>{const c=cell(p,a);return `<td>${c?`<button class="ch ${c.st}" onclick="openLog('${p.id}',${a[0]})">${c.done}/${c.exp}</button>`:'<span class="mut">–</span>'}</td>`}).join('')}</tr>`});
 return h+'</table></div>'}
function an(){const doms=[...new Set(ACT.map(a=>a[1]))],rows=[];
 const ag=a=>{let e=0,d=0;P().forEach(p=>{const c=cell(p,a);if(c){e+=c.exp;d+=Math.min(c.done,c.exp)}});return{e,d,s:e?Math.round(d/e*100):null}};
 const dm=doms.map(n=>{let e=0,d=0;ACT.filter(a=>a[1]==n).forEach(a=>{const g=ag(a);e+=g.e;d+=g.d});return{n,s:e?Math.round(d/e*100):null}});
 const ar=ACT.map(a=>({a,...ag(a)})).filter(x=>x.s!=null).sort((x,y)=>x.s-y.s).slice(0,8);
 const wkS=D(per.s),nW=Math.ceil((Math.min(T,D(per.e))-wkS)/DAY/7)||1,wc=Array(nW).fill(0);
 Object.values(logs).flat().forEach(l=>{if(l.d>=per.s&&l.d<=per.e){const i=Math.floor((D(l.d)-wkS)/DAY/7);if(i>=0&&i<nW)wc[i]++}});
 const mxv=Math.max(1,...wc),bw=Math.max(6,Math.min(26,640/nW-3));
 const bars=l=>l.map(x=>`<div style="margin-bottom:9px"><div class="r" style="display:flex;justify-content:space-between"><span>${esc(x.n)}</span><b class="${col(x.s)}">${x.s==null?'—':x.s+'%'}</b></div><div class="bar"><i class="bg-${col(x.s)||'ok'}" style="width:${x.s||0}%"></i></div></div>`).join('');
 return `<div class="g c2"><div class="card"><h3>Compliance by domain</h3>${bars(dm)}</div>
 <div class="card"><h3>Furthest behind (all leaders combined)</h3>${ar.length?bars(ar.map(x=>({n:x.a[2],s:x.s}))):'<div class="empty">Nothing due yet.</div>'}</div></div>
 <div class="card" style="margin-top:12px"><h3>Actions logged per week — ${per.n}</h3><div style="overflow-x:auto"><svg width="${nW*(bw+3)+30}" height="130" role="img" aria-label="Weekly log counts">${wc.map((v,i)=>`<rect x="${i*(bw+3)+24}" y="${110-v/mxv*95}" width="${bw}" height="${v/mxv*95}" rx="2" fill="var(--ac)"/><text x="${i*(bw+3)+24+bw/2}" y="124" font-size="9" text-anchor="middle" fill="var(--mut)">${i+1}</text>${v?`<text x="${i*(bw+3)+24+bw/2}" y="${106-v/mxv*95}" font-size="9" text-anchor="middle" fill="var(--tx)">${v}</text>`:''}`).join('')}</svg></div><div class="mut">Week number of semester. A flat or falling line means monitoring is slipping.</div></div>
 <div class="card" style="margin-top:12px"><h3>Leader comparison</h3>${bars(P().map(p=>({n:p.name,s:stats(p).score})))}</div>`}
</script></body></html>
